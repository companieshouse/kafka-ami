---

kafka_binary_name: "kafka_{{ scala_version }}-{{ kafka_version }}.tgz"
kafka_data_directory: /data/kafka
kafka_heap_opts: "-Xmx1G -Xms1G"
kafka_log_directory: /var/log/kafka
kafka_home: "{{ kafka_install_directory }}/kafka"
kafka_install_directory: /opt
kafka_service_group: kafka
kafka_service_user: kafka
kafka_timezone: Europe/London
