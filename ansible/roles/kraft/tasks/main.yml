---

- name: Write KRaft config fragment
  ansible.builtin.template:
    src: opt/kafka/config/conf.d/20-kraft.properties.j2
    dest: "{{ kafka_home }}/config/conf.d/20-kraft.properties"
    owner: "{{ kafka_service_user }}"
    group: "{{ kafka_service_group }}"
    mode: '0644'

- name: Assemble server.properties from conf.d fragments
  ansible.builtin.assemble:
    src: "{{ kafka_home }}/config/conf.d"
    dest: "{{ kafka_home }}/config/server.properties"
    owner: "{{ kafka_service_user }}"
    group: "{{ kafka_service_group }}"
    mode: '0644'

- name: Install kafka-bootstrap script
  ansible.builtin.template:
    src: usr/local/bin/kafka-bootstrap.sh.j2
    dest: /usr/local/bin/kafka-bootstrap.sh
    owner: root
    group: root
    mode: '0755'

- name: Install kafka-bootstrap systemd unit
  ansible.builtin.template:
    src: etc/systemd/system/kafka-bootstrap.service.j2
    dest: /etc/systemd/system/kafka-bootstrap.service
    owner: root
    group: root
    mode: '0644'

- name: Enable kafka-bootstrap service
  ansible.builtin.systemd:
    name: kafka-bootstrap
    enabled: true
    daemon_reload: true
